- type: reaction
  id: Steel
  reactants:
    Iron:
      amount: 1
    Carbon:
      amount: 1
  products:
    Steel: 1

# Электролиз и центрифуга: по умолчанию скрыты и не развёрнуты, пока
# пользователь не выберет их рецептуру вручную.
- type: reaction
  id: RadiumSalt
  requiredMixerCategories:
  - Electrolysis
  reactants:
    Sulfur:
      amount: 2
  products:
    RadiumSalt: 1

- type: reaction
  id: RadiumPowder
  requiredMixerCategories:
  - Centrifuge
  reactants:
    RadiumSalt:
      amount: 1
    Oxygen:
      amount: 1
  products:
    RadiumPowder: 1

- type: reaction
  id: GlowMixture
  reactants:
    RadiumPowder:
      amount: 1
    RadiumSalt:
      amount: 1
  products:
    GlowMixture: 1

# Добавочный продукт: главный продукт SolventMix, Grit — побочный,
# по умолчанию скрыт и его выбор не сохраняется.
- type: reaction
  id: SolventMix
  reactants:
    Iron:
      amount: 1
    Aluminum:
      amount: 1
  products:
    SolventMix: 3
    Grit: 1

# Grit нужен как реактант: строка кликабельна, но не развёрнута.
- type: reaction
  id: GritPane
  reactants:
    Grit:
      amount: 1
    Steel:
      amount: 1
  products:
    GritPane: 1
