# Тестовая цепочка: Альфа -> Бета -> Гамма -> Дифенгидрамин -> Серная кислота.
# Глубина рекурсии 4, катализатор со своим рецептом ([р] и «Сера» ниже).
- type: reaction
  id: AlphaMix
  reactants:
    BetaMix:
      amount: 1
    Water:
      amount: 5
  products:
    AlphaMix: 1

- type: reaction
  id: BetaMix
  reactants:
    GammaMix:
      amount: 2
    Carbon:
      amount: 2
  products:
    BetaMix: 1

- type: reaction
  id: GammaMix
  reactants:
    Diphenhydramine:
      amount: 1
    Hydrogen:
      amount: 3
  products:
    GammaMix: 1

- type: reaction
  id: Diphenhydramine
  reactants:
    SulfuricAcid:
      amount: 1
      catalyst: true
    Ethanol:
      amount: 4
  products:
    Diphenhydramine: 1

- type: reaction
  id: SulfuricAcid
  reactants:
    Water:
      amount: 1
    Sulfur:
      amount: 1
    Oxygen:
      amount: 1
  products:
    SulfuricAcid: 1

# Второй рецепт Дифенгидрамина: реагент становится неоднозначным, и калькулятор
# предлагает выбрать рецептуру прямо в дереве.
- type: reaction
  id: DiphenhydramineFromEthanol
  reactants:
    Ethanol:
      amount: 8
  products:
    Diphenhydramine: 1
